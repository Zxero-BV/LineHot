<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Carnage - Ultimate Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="gameWrapper">
        <canvas id="gameCanvas"></canvas>
    </div>
    <div id="crt-overlay" class="crt-flicker"></div>

    <div id="uiLayer">
        <div class="hud-top">
            <div>
                <div class="score-container">SCORE<br><span id="scoreEl">000000</span></div>
                <div id="highScoreEl">HI: 000000</div>
            </div>
            <div class="combo-container" id="comboEl">x1<br>COMBO</div>
        </div>
        <div class="hud-bottom">
            <div class="bars-container">
                <div style="color:white; font-size: 0.7rem;">HP</div>
                <div class="bar-bg"><div class="bar-fill" id="healthFill"></div></div>
                <div style="color:white; font-size: 0.7rem; margin-top:5px;">DASH (Spacebar / Doble Tap)</div>
                <div class="bar-bg"><div class="bar-fill" id="dashFill"></div></div>
            </div>
            <div class="weapon-info">
                <div class="weapon-text" id="weaponName">PISTOL</div>
                <div id="weaponAmmo">∞</div>
            </div>
        </div>
    </div>

    <div id="screens">
        <h1 class="title" id="mainTitle">NEON<br>CARNAGE</h1>
        <p class="subtitle" id="subTitle">
            <span class="highlight">PC:</span> WASD/Flechas para Mover | Ratón para Apuntar/Disparar | ESPACIO para Dash<br>
            <span class="highlight">MÓVIL:</span> Joystick Izquierdo Mueve | Derecho Apunta | Doble Tap para Dash<br><br>
            Sobrevive. Destruye. Evita los <span style="color:var(--neon-green)">Pilares de Neón</span>.
        </p>
        <button class="btn" id="startBtn">JACK IN</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
